[workspace]
resolver = "2"
members = ["crates/kernel", "crates/tools", "crates/terminal", "crates/agent", "crates/guardian", "crates/sandbox", "crates/subagent", "crates/mcp", "crates/skills", "crates/skillopt", "crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
kernel = { path = "crates/kernel" }
tools = { path = "crates/tools" }
skills = { path = "crates/skills" }
skillopt = { path = "crates/skillopt" }
onyx-core = { path = "crates/core" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
ratatui = "0.30"
crossterm = "0.29"
# TLS for cloud providers: rustls with the pure-ish `ring` backend (aws-lc-rs is
# NOT cached on this arm64 PRoot box and needs cmake, so we pin ring explicitly).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
ring = "0.17"
getrandom = "0.2"
# At-rest encryption for the credential vault (pure Rust, no C toolchain).
aes-gcm = "0.10"
subtle = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
