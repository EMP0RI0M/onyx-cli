name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cross:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            binary_name: onyx
            asset_name: onyx-linux-amd64
          # Linux ARM64 (aarch64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            binary_name: onyx
            asset_name: onyx-linux-arm64
          # Linux ARM32 (armv7)
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use_cross: true
            binary_name: onyx
            asset_name: onyx-linux-arm32
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            binary_name: onyx
            asset_name: onyx-darwin-arm64
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-14
            use_cross: false
            binary_name: onyx
            asset_name: onyx-darwin-amd64
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            binary_name: onyx.exe
            asset_name: onyx-windows-amd64.exe
          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            binary_name: onyx.exe
            asset_name: onyx-windows-arm64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary with cargo
        if: "!matrix.use_cross"
        run: cargo build --release -p onyx-cli --target ${{ matrix.target }}

      - name: Build binary with cross
        if: matrix.use_cross
        run: cross build --release -p onyx-cli --target ${{ matrix.target }}

      - name: Prepare asset (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          tar -czvf dist/${{ matrix.asset_name }}.tar.gz -C dist ${{ matrix.asset_name }}
          cd dist && sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Prepare asset (Windows)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cd dist
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build-cross
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
